<div class="h3 p-2" routerLink=".." ><u>Back</u></div>
<div class="h1 px-4">Statistiche</div>
<div class="bg-white border border-black border-2 m-5 d-flex flex-column p-4">
    <app-giocatore [nome]="nome" [ruolo]="ruolo" class="'giocatore'"></app-giocatore>
    <div class="d-flex flex-row m-4 justify-content-around">
        <div class="d-flex flex-column" *ngFor="let s of statistiche.slice(0, 6)">
            <div class="fw-bold d-flex justify-content-center">{{s.nome}}</div>
            <div>{{s.valore}}</div>
        </div>
    </div>
    <div class="d-flex flex-row m-3 justify-content-around">
        <div class="d-flex flex-column" *ngFor="let s of statistiche.slice(6)">
            <div class="fw-bold d-flex justify-content-center">{{s.nome}}</div>
            <div>{{s.valore}}</div>
        </div>
    </div>
</div>

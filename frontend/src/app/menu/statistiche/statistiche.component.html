<div class="h3 p-2" routerLink=".." ><u>Back</u></div>
<div class="h1 px-4">Statistiche</div>
<div class="px-5 pt-1 d-flex flex-row">
    <input id="name" type="text" class="w-100 mx-1" [formControl]="name">
    <select id="team" class="form-select mx-1" [formControl]="squadra" >
        <option *ngFor="let s of squadre" [ngValue]="s">
          {{ s.nome }}
        </option>
    </select>
</div>


<div id="giocatori" class="m-4 lista overflow-auto" >
    <div *ngFor="let s of statistiche" class="cliccable" (click)="visualizzaStatistiche(s.giocatore)">
        <app-giocatore 
        [nome]="s.giocatore.nome" 
        [ruolo]="s.giocatore.ruolo" 
        [enableStat]="true"
        [punti]="s.punti"
        [assist]="s.assist"
        [rimbalzi]="s.rimbalzi"
        *ngIf="show(s.giocatore.nome)"></app-giocatore>
    </div>
</div>

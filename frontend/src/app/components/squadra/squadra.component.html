<div class="h1 px-4">Squadra</div>
<div class="p-4">

    <div id="giocatori" class="mt-3 m-3 border border-1 border-black overflow-auto" >
        <app-giocatore  *ngFor="let g of squadra" [nome]="g.nome" [ruolo]="g.ruolo"></app-giocatore>
    </div>
</div>
